MEMORY {
    Packed: start=$1000, size=$0100, file=%O;
    Code:   start=$2400, size=$0100, file="";
    Music:  start=$7400, size=$0100, file="";
}
SEGMENTS {
    STUB:   load=Packed, type=ro;
    PLAYER: load=Packed, run=Code,  type=rw, define=yes;
    NOTES:  load=Packed, run=Music, type=ro, define=yes;
}
